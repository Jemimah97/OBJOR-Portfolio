<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white p-8">
    <div class="max-w-4xl mx-auto">
        <a href="{% url 'home' %}" class="text-blue-400 hover:text-white mb-6 inline-block">&larr; Back to Home</a>
        
        <h1 class="text-4xl font-bold mb-8 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-400">
            My Projects
        </h1>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            {% for project in projects %}
            <div class="bg-blue-900/30 p-6 rounded-xl border border-blue-800 hover:border-blue-500 transition">
                <h2 class="text-xl font-bold mb-2 text-blue-100">{{ project.project_name }}</h2>
                <p class="text-blue-300/70 text-sm mb-4">{{ project.description|truncatewords:20 }}</p>
                <a href="{% url 'project_detail' project.pk %}" class="text-blue-400 font-semibold hover:underline">
                    View Details &rarr;
                </a>
            </div>
            {% empty %}
            <p class="text-slate-400">No projects added yet.</p>
            {% endfor %}
        </div>
    </div>
</body>
</html>
