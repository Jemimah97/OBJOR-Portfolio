<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Testimonials</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#070d19] text-blue-100 font-sans p-6 md:p-12 flex flex-col items-center min-h-screen">
    
    <div class="max-w-4xl w-full bg-[#091124] border border-blue-900/50 rounded-xl p-8 shadow-2xl space-y-6">
 
        <div class="border-b border-blue-900/40 pb-4 flex justify-end">
            <nav class="flex gap-6 text-xs font-bold uppercase tracking-wider">
                <a href="{% url 'home' %}" class="text-blue-400 hover:text-white transition pb-1">Home</a>
                <a href="{% url 'about' %}" class="text-blue-400 hover:text-white transition pb-1">About</a>
                <a href="{% url 'contact' %}" class="text-blue-400 hover:text-white transition pb-1">Contact</a>
                <a href="{% url 'testimony_list' %}" class="text-white border-b-2 border-blue-500 pb-1">Testimonials</a>
            </nav>
        </div>

       <div class="flex justify-between items-center">
            <h1 class="text-2xl md:text-3xl font-black text-white uppercase tracking-wider">WHAT PEOPLE SAY</h1>
            <a href="{% url 'add_testimony' %}" class="inline-block border border-blue-600 hover:bg-blue-600/20 text-blue-400 hover:text-white font-bold text-xs uppercase tracking-wider px-6 py-3 rounded-lg transition">
                + Add Testimony
            </a>
        </div>

        <div class="space-y-4">
            {% for testimony in testimonies %}
                <div class="p-4 bg-[#0d1731]/50 border border-blue-900/40 rounded-lg space-y-2">
                    <a href="{% url 'testimony_detail' testimony.pk %}" class="text-lg font-bold text-blue-400 hover:underline">
                        {{ testimony.full_name }}
                    </a>
                    <p class="text-sm text-blue-200/90 whitespace-pre-line">{{ testimony.content }}</p>
                </div>
            {% empty %}
                <p class="text-blue-300 text-center py-6">No testimonies yet.</p>
            {% endfor %}
        </div>

        <div class="pt-4 text-center">
            <a href="{% url 'home' %}" class="inline-block bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs uppercase tracking-wider px-6 py-3 rounded-lg transition shadow-lg">
                &larr; Back to Home
            </a>
        </div>
        
    </div>

</body>
</html>
