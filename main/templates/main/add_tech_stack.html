<!DOCTYPE html>
<html lang="en" class="bg-[#070d19] text-blue-100 font-mono antialiased min-h-screen p-4 md:p-8">
<head>
    <meta charset="UTF-8">
    <title>Add Tech Stack</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="max-w-xl mx-auto border border-blue-900/50 bg-[#091124]/90 rounded-xl shadow-2xl overflow-hidden mt-10">
        
        <!-- Header -->
        <div class="bg-[#0d1731] px-6 py-4 border-b border-blue-900/40 flex justify-between items-center">
            <h3 class="text-sm font-bold text-white uppercase tracking-wider">Add New Tech Stack</h3>
            <a href="{% url 'dashboard' %}" class="text-xs text-blue-400 hover:text-white uppercase tracking-wider transition">Back to Dashboard</a>
        </div>

        <div class="p-6 md:p-8">
            <form method="POST">
                {% csrf_token %}
                <div class="mb-6">
                    <label for="id_name" class="block text-xs font-semibold text-blue-300 mb-2 uppercase tracking-wider">Tech Stack Name</label>
                    <input type="text" name="name" id="id_name" class="w-full px-4 py-2.5 bg-[#070d19] border border-blue-900/60 rounded-lg text-blue-100 text-sm focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-900/50 transition">
                </div>
                
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold uppercase tracking-wider py-3 px-6 rounded-lg transition duration-200 shadow-md">
                    Save Tech Stack
                </button>
            </form>
        </div>
    </div>
</body>
</html>
