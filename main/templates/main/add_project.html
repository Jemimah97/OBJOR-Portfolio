<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Project</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#070d19] text-blue-100 font-sans p-6 md:p-12 flex justify-center items-center min-h-screen">
    <div class="max-w-lg w-full bg-[#091124] border border-blue-900/50 rounded-xl p-8 shadow-2xl">
        <h1 class="text-2xl font-bold text-white mb-6 uppercase tracking-wider">Add New Project</h1>
        <form method="POST" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg uppercase tracking-wider text-xs transition">
                Save Project
            </button>
        </form>
        <div class="mt-6 text-center">
            <a href="{% url 'project_list' %}" class="text-xs text-blue-400 hover:underline">Back to Projects</a>
        </div>
    </div>
</body>
</html>
