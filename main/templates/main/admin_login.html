<!DOCTYPE html>
<html lang="en" class="bg-[#070d19] text-blue-100 font-mono antialiased min-h-screen p-4 md:p-8">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="max-w-4xl mx-auto border border-blue-900/50 bg-[#091124]/90 rounded-xl shadow-2xl overflow-hidden min-h-[calc(100vh-4rem)]">
        
        <div class="bg-[#0d1731] px-6 py-4 border-b border-blue-900/40 flex justify-between items-center">
            <div>
                <a href="{% url 'home' %}" class="text-xs text-blue-400 hover:text-white uppercase tracking-wider transition">Back to Portfolio</a>
            </div>
            <div class="text-xs text-blue-400 uppercase tracking-wider">
                Admin Access
            </div>
        </div>

        <div class="p-6 md:p-12 flex flex-col items-center justify-center min-h-[calc(100vh-12rem)]">
            <div class="w-full max-w-md bg-[#070d19] p-8 rounded-2xl border border-blue-900/60 shadow-lg">
                
                <h3 class="text-xl font-bold text-center text-white mb-6 tracking-tight">Admin Login</h3>
                
                {% if messages %}
                    {% for message in messages %}
                        <div class="bg-red-900/50 border border-red-700 text-red-200 px-4 py-3 rounded-lg mb-6 text-center text-xs">{{ message }}</div>
                    {% endfor %}
                {% endif %}

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-5">
                        <label for="username" class="block text-xs font-semibold text-blue-300 mb-1.5 uppercase tracking-wider">Username</label>
                        <input type="text" name="username" id="username" class="w-full px-4 py-2.5 bg-[#091124] border border-blue-900/60 rounded-lg text-blue-100 text-sm focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-900/50 transition" required placeholder="Enter username">
                    </div>
                    <div class="mb-8">
                        <label for="password" class="block text-xs font-semibold text-blue-300 mb-1.5 uppercase tracking-wider">Password</label>
                        <input type="password" name="password" id="password" class="w-full px-4 py-2.5 bg-[#091124] border border-blue-900/60 rounded-lg text-blue-100 text-sm focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-900/50 transition" required placeholder="Enter password">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold uppercase tracking-wider py-3 px-6 rounded-lg transition duration-200 shadow-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-[#070d19]">
                        Login
                    </button>
                </form>

                <div class="mt-6 text-center text-[10px] text-blue-500/70 tracking-wider">
                    &copy; Authorized Personnel Only.
                </div>
            </div>
        </div>
    </div>
</body>
</html>
