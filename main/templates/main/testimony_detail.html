<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Testimony Detail</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#070d19] text-blue-100 font-sans p-6 md:p-12 flex justify-center items-center min-h-screen">
    <div class="max-w-xl w-full bg-[#091124] border border-blue-900/50 rounded-xl p-8 shadow-2xl space-y-4">
        <h1 class="text-2xl font-bold text-white uppercase tracking-wider">{{ testimony.full_name }}</h1>
        <p class="text-blue-200/90 leading-relaxed bg-[#0d1731]/50 p-4 rounded-lg border border-blue-900/40">{{ testimony.content }}</p>
        <p class="text-xs text-blue-400/60">Posted on: {{ testimony.created_at }}</p>
        <div class="pt-4">
            <a href="{% url 'testimony_list' %}" class="text-xs text-blue-400 hover:underline">&larr; Back to Testimonials</a>
        </div>
    </div>
</body>
</html>
